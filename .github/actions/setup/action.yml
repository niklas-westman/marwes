name: Setup workspace
description: Install pnpm, Node.js and workspace dependencies. Run after checkout.

runs:
  using: composite
  steps:
    # pnpm version comes from the packageManager field in package.json
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
