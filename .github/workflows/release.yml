name: Release
# Post-merge workflow that runs CI checks and then publishes packages to npm
# Ensures code quality before releasing by running full CI suite first

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Run CI checks on the merged code and upload build artifacts
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      upload-build: true

  # Publish packages to npm after CI passes
  release:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]

    steps:
      # Clone the repository with full git history for changelog generation
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install pnpm package manager (reads version from packageManager field in package.json)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # npm exchanges the GitHub OIDC identity during publishing; no npm token is needed.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify trusted publishing prerequisites
        run: |
          node --version
          npm --version
          pnpm --version
          node <<'NODE'
          const { execFileSync } = require("node:child_process")
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim()
          const [major, minor, patch] = version.split(".").map(Number)
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            console.error(`::error::npm >= 11.5.1 is required for trusted publishing; found ${version}`)
            process.exit(1)
          }
          NODE

      # Fail with clear setup guidance before npm or Changesets produce indirect auth errors
      - name: Validate release secrets
        env:
          CHANGESETS_PR_TOKEN: ${{ secrets.CHANGESETS_PR_TOKEN }}
        run: |
          if [ -z "$CHANGESETS_PR_TOKEN" ]; then
            echo "::error::CHANGESETS_PR_TOKEN is required so generated release PRs trigger CI."
            exit 1
          fi

      # Install all project dependencies using exact versions from pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile

      # Download build artifacts from CI job to avoid rebuilding
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      # Create release PR or publish packages to npm using changesets
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          # Use the dedicated token for release PR pushes; GITHUB_TOKEN pushes do not trigger CI.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PR_TOKEN }}
          # Release PR pushes happen after CI already passed in this workflow.
          LEFTHOOK: 0
