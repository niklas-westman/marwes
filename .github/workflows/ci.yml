name: CI
# Pull request gate. Scope checks live here; validation is the shared _ci.yml.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, install-free: decides whether heavy jobs can be skipped (docs-only PRs)
  detect:
    name: detect scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          heavy=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.mdx?$'; then
              heavy=false
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  changed-scope:
    name: changed-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Changed-scope validation
        run: pnpm check:changed -- --base origin/${{ github.base_ref }}

      - name: Require changeset for package changes
        env:
          CHANGESET_BASE_REF: origin/${{ github.base_ref }}
        run: node ./scripts/check-pr-changeset.mjs

  validate:
    needs: [detect]
    uses: ./.github/workflows/_ci.yml
    with:
      heavy: ${{ needs.detect.outputs.heavy == 'true' }}
